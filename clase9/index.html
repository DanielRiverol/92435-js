<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/main.js"></script>
    <script defer src="./js/script.js"></script>
    <title>Clase 9 | Comisión 92435</title>
  </head>
  <body>
    <main class="wrapper">
      <h1>Asincronía y promesas</h1>
      <hr />
      <h2>Catálogo de productos</h2>
      <!-- Seccion busqueda -->
      <section class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="Ej: Teclado, Monitor, Silla..." />
        <div class="search-buttons">
          <button id="btnFind" class="btn-search">
            Buscar con FIND (1º coincidencia)
          </button>
          <button id="btnFilter" class="btn-search">
            Buscar con FILTER (Todas)
          </button>
          <button id="btnReset" class="btn-reset">Restablecer</button>
        </div>
      </section>
      <!-- Contenedor para los productos (Grid) -->
      <section id="productos-container" class="productos-grid">
       
        <div class="card-popup hide" id="card-popup">
          <h3>Soy un POPUP</h3>
          <p class="precio">Debería desaparecer pronto</p>
        </div>
      </section>
      <button class="btn-primary" id="boton-popup">Mostrar Popup</button>
    </main>
    <dialog id="modalMensaje" class="modal">
      <div class="modal-content">
        <h3 id="modalTitulo">Mensaje</h3>
        <p id="modalTexto"></p>
        <button id="btnCerrarModal" class="btn-primary">Aceptar</button>
      </div>
    </dialog>
  </body>
</html>
